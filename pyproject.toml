[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=84.2.1" ]

[project]
name = "google-docstring-parser"
version = "0.0.11"
description = """\
  A lightweight, efficient parser for Google-style Python docstrings that converts them into structured dictionaries.\
  """
readme = "README.md"
keywords = [ "docstring", "documentation", "google-style", "parser", "python", "static-analysis", "type-hints" ]
license = "LicenseRef-Proprietary"
license-files = [ "LICENSE" ]
maintainers = [ { name = "Vladimir Iglovikov" } ]
authors = [ { name = "Vladimir Iglovikov" } ]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Documentation",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "docstring-parser>=0.18",
]
optional-dependencies.dev = [
  "pre-commit>=4.7",
  "pytest>=9.2",
]

[tool.setuptools]
packages = [ "google_docstring_parser", "tools" ]
package-data.google_docstring_parser = [ "*.md", "py.typed" ]
exclude-package-data."*" = [ "tests*" ]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
target-version = "py311"
line-length = 120
indent-width = 4
exclude = [
  ".bzr",
  ".cursor",
  ".direnv",
  ".eggs",
  ".git",
  ".git-rewrite",
  ".hg",
  ".ipynb_checkpoints",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".pyenv",
  ".pytest_cache",
  ".pytype",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  ".vscode",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "node_modules",
  "site",
  "site-packages",
  "tests",
  "venv",
]
format.indent-style = "space"
# Like Black, respect magic trailing commas.
format.quote-style = "double"
# Like Black, indent with spaces, rather than tabs.
format.line-ending = "auto"
format.skip-magic-trailing-comma = false
# Like Black, automatically detect the appropriate line ending.
lint.select = [ "ALL" ]
lint.ignore = [
  "D107",
  "EM101",
  "EM102",
  "FBT001",
]
# Allow fix for all enabled rules (when `--fix`) is provided.
lint.explicit-preview-rules = true
lint.per-file-ignores = { "__init__.py" = [
  "F401",
], "tools/*.py" = [
  "ANN201",
  "BLE001",
  "FBT002",
  "PLR0913",
  "T201",
] }
lint.fixable = [ "ALL" ]
lint.unfixable = []
# Allow unused variables when underscore-prefixed.
lint.dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
# Like Black, use double quotes for strings.
lint.pydocstyle.convention = "google"

[tool.mypy]
ignore_missing_imports = true
follow_imports = "silent"
python_version = "3.11"
disallow_any_generics = true
# for strict mypy: (this is the tricky one :-))
disallow_untyped_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_reexport = true

[tool.docstring_checker]
paths = [ "google_docstring_parser", "tools" ]
require_param_types = true
check_references = true
check_type_consistency = true
min_short_description_length = 50
exclude_files = [ "test_malformed_docstrings.py" ]
verbose = false
